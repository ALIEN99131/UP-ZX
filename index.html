      <main class="main"><header class="main-topbar"><nav class="tab-strip" id="tab-strip" aria-label="已打开功能"></nav><div class="top-right"><button class="icon-btn annotate-btn" id="annotate-current" type="button" aria-label="独立字段标注" title="独立字段标注"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg></button><div class="user-profile"><button class="user-profile-trigger" type="button" aria-label="查看用户信息"><span class="user-avatar">演</span><span>演示用户</span></button><div class="user-profile-card"><div class="profile-name">演示用户</div><div class="profile-meta">工号：ZX00001<br>角色：系统管理员</div><button class="profile-password" id="change-password" type="button">修改密码</button></div></div><button class="logout" id="logout">退出登录</button></div></header><div class="crumbbar"><span id="current-group">工作台</span><span class="crumb-separator">/</span><strong id="current-page">首页</strong></div><div class="content"><iframe class="module-frame active" id="frame-home" src="模块/首页.html" title="首页"></iframe><iframe class="module-frame" id="frame-product" src="模块/产品管理.html" title="产品主数据"></iframe><iframe class="module-frame" id="frame-users" src="模块/用户中心.html" title="用户与权限中心"></iframe><iframe class="module-frame" id="frame-org" src="模块/组织架构.html" title="组织架构"></iframe></div></main>
    </div>
  </div>
</div>
<div class="password-mask" id="password-mask" role="dialog" aria-modal="true" aria-labelledby="password-title"><div class="password-dialog"><div class="password-head"><span id="password-title">修改密码</span><button class="icon-btn" id="close-password" type="button" aria-label="关闭">×</button></div><div class="password-body"><label for="new-password">新密码</label><input id="new-password" type="password" placeholder="请输入新密码" /><label for="confirm-password">确认新密码</label><input id="confirm-password" type="password" placeholder="请再次输入新密码" /><label for="password-code">手机验证码</label><div class="password-code-row"><input id="password-code" type="text" inputmode="numeric" maxlength="6" placeholder="请输入验证码" /><button id="send-password-code" type="button">发送验证码</button></div><div class="password-error" id="password-error" role="alert"></div></div><div class="password-foot"><button id="cancel-password" type="button">取消</button><button class="confirm" id="save-password" type="button">确定</button></div></div></div>
<style>
.home-dashboard{display:grid;grid-template-columns:minmax(0,3fr) minmax(240px,1fr);gap:16px;padding:16px;background:#F5F6F8;height:100%;overflow:auto}.home-clock{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border:1px solid #D9E0EB}.home-clock-label{color:#1677FF;font-weight:600}.home-clock-item{padding:8px 12px;border:1px solid #D9E0EB}.home-card{background:#fff;border:1px solid #D9E0EB;padding:16px;min-height:220px}.home-card h2{margin:0 0 28px;font-size:20px}.home-table{width:100%;border-collapse:collapse}.home-table th,.home-table td{text-align:left;padding:10px 0;border-bottom:1px solid #E5E6EB}.home-empty{height:150px;display:grid;place-items:center;font-size:20px;color:#1F2329}@media(max-width:767px){.home-dashboard{grid-template-columns:1fr}.home-clock{flex-wrap:wrap}}
</style>
<script>
const nav=document.querySelector('.nav');
const app=document.querySelector('#app');const items=[...document.querySelectorAll('.nav-item,[data-page="home"]')];const frames={home:document.querySelector('#frame-home'),product:document.querySelector('#frame-product'),users:document.querySelector('#frame-users'),org:document.querySelector('#frame-org')};const labels={home:['工作台','首页'],products:['产品主数据','产品列表'],category:['产品主数据','品类管理'],attribute:['产品主数据','属性管理'],encoding:['产品主数据','编码规则'],users:['系统','用户管理'],roles:['系统','角色管理'],posts:['人事','部门管理'],org:['人事','组织架构']};let current={frame:'home',page:'home'};let openedTabs=['home'];
function navigateFrame(frame,page){if(!frame)return;if(frame.contentWindow)frame.contentWindow.postMessage({type:'prototype:navigate',module:current.frame,page},'*')}
function renderTabs(){
  const strip=document.querySelector('#tab-strip');strip.replaceChildren();
  openedTabs.forEach(page=>{
    const tab=document.createElement('div');tab.className='work-tab'+(page===current.page?' active':'');tab.title=labels[page].join(' / ');
    const select=document.createElement('button');select.type='button';select.className='tab-select';select.textContent=labels[page][1];select.setAttribute('aria-label','切换到'+labels[page][1]);if(page===current.page)select.setAttribute('aria-current','page');select.addEventListener('click',()=>activateFeature(page));tab.appendChild(select);
    if(page!=='products'){const close=document.createElement('button');close.type='button';close.className='tab-close';close.textContent='×';close.setAttribute('aria-label','关闭'+labels[page][1]);close.title='关闭'+labels[page][1];close.addEventListener('click',()=>closeFeature(page));tab.appendChild(close)}
    strip.appendChild(tab);if(page===current.page)tab.scrollIntoView({block:'nearest',inline:'nearest'});
  });
}
function activateFeature(page){
  const item=items.find(x=>x.dataset.page===page);if(!item)return;
  current={frame:item.dataset.frame,page};items.forEach(x=>{x.classList.toggle('active',x===item);if(x===item)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});
  Object.entries(frames).forEach(([key,frame])=>frame.classList.toggle('active',key===current.frame));
  document.querySelector('#current-group').textContent=labels[page][0];document.querySelector('#current-page').textContent=labels[page][1];
  nav.classList.remove('menu-product-open','menu-system-open','menu-personnel-open');
  if(current.frame==='product')nav.classList.add('menu-product-open');
  else if(['posts','org'].includes(current.page))nav.classList.add('menu-personnel-open');
  else if(['users','roles'].includes(current.page))nav.classList.add('menu-system-open');
  navigateFrame(frames[current.frame],page);renderTabs();
}
function openFeature(page){if(!openedTabs.includes(page))openedTabs.push(page);activateFeature(page)}
function closeFeature(page){const index=openedTabs.indexOf(page);if(index<=0)return;openedTabs.splice(index,1);if(current.page===page)activateFeature(openedTabs[Math.max(0,index-1)]);else renderTabs()}
items.forEach(item=>{item.addEventListener('click',()=>openFeature(item.dataset.page));item.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();openFeature(item.dataset.page)}})});
const menuGroups=[...document.querySelectorAll('.menu-level-1[data-menu]')];
menuGroups.forEach(group=>{const toggle=()=>{const key=group.dataset.menu;nav.classList.toggle(`menu-${key}-open`)};group.addEventListener('click',toggle);group.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();toggle()}})});
const collapsedMenu=document.createElement('div');collapsedMenu.className='collapsed-menu-flyout';collapsedMenu.setAttribute('role','menu');document.body.appendChild(collapsedMenu);let collapsedMenuTimer=null;
function collapsedItems(key){return key==='product'?[...nav.querySelectorAll('.nav-item[data-frame="product"]')]:[...nav.querySelectorAll(`.nav-item.menu-${key}`)]}
function hideCollapsedMenu(){clearTimeout(collapsedMenuTimer);collapsedMenu.classList.remove('show');collapsedMenu.replaceChildren()}
function queueCollapsedMenuClose(){clearTimeout(collapsedMenuTimer);collapsedMenuTimer=setTimeout(hideCollapsedMenu,160)}
function showCollapsedMenu(group){if(!app.classList.contains('sidebar-collapsed'))return;clearTimeout(collapsedMenuTimer);const key=group.dataset.menu,itemsForMenu=collapsedItems(key),rect=group.getBoundingClientRect();collapsedMenu.replaceChildren();const title=document.createElement('div');title.className='collapsed-menu-title';title.textContent=key==='product'?'产品管理':key==='system'?'用户中心':'组织管理';collapsedMenu.appendChild(title);itemsForMenu.forEach(item=>{const button=document.createElement('button');button.type='button';button.setAttribute('role','menuitem');button.textContent=item.querySelector('span').textContent;button.classList.toggle('active',item.classList.contains('active'));button.addEventListener('click',()=>{openFeature(item.dataset.page);hideCollapsedMenu()});collapsedMenu.appendChild(button)});collapsedMenu.style.left=`${rect.right+8}px`;collapsedMenu.style.top=`${Math.max(8,rect.top-8)}px`;collapsedMenu.classList.add('show')}
menuGroups.forEach(group=>{group.addEventListener('mouseenter',()=>showCollapsedMenu(group));group.addEventListener('focus',()=>showCollapsedMenu(group));group.addEventListener('click',()=>showCollapsedMenu(group));group.addEventListener('mouseleave',queueCollapsedMenuClose)});collapsedMenu.addEventListener('mouseenter',()=>clearTimeout(collapsedMenuTimer));collapsedMenu.addEventListener('mouseleave',queueCollapsedMenuClose);nav.addEventListener('mouseleave',queueCollapsedMenuClose);document.addEventListener('click',event=>{if(!collapsedMenu.contains(event.target)&&!event.target.closest('.menu-level-1'))hideCollapsedMenu()});
Object.entries(frames).forEach(([module,frame])=>frame.addEventListener('load',()=>{if(module===current.frame)navigateFrame(frame,current.page)}));
window.addEventListener('message',event=>{if(event.source===document.querySelector('.login-frame').contentWindow&&event.data==='login-success'){app.classList.add('logged-in');navigateFrame(frames[current.frame],current.page)}});
document.querySelector('#logout').addEventListener('click',()=>{app.classList.remove('logged-in');openedTabs=['home'];activateFeature('home');document.querySelector('.login-frame').contentWindow.location.reload()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&document.querySelector('#password-mask').classList.contains('show'))document.querySelector('#close-password').click()});
const passwordMask=document.querySelector('#password-mask');const passwordError=document.querySelector('#password-error');const passwordCode=document.querySelector('#password-code');const sendPasswordCode=document.querySelector('#send-password-code');let passwordCodeSent=false,passwordCodeTimer=null;const closePassword=()=>{passwordMask.classList.remove('show');passwordError.textContent='';document.querySelector('#new-password').value='';document.querySelector('#confirm-password').value='';passwordCode.value='';passwordCodeSent=false;if(passwordCodeTimer){clearInterval(passwordCodeTimer);passwordCodeTimer=null}sendPasswordCode.disabled=false;sendPasswordCode.textContent='发送验证码'};document.querySelector('#change-password').addEventListener('click',()=>{passwordMask.classList.add('show');document.querySelector('#new-password').focus()});document.querySelector('#close-password').addEventListener('click',closePassword);document.querySelector('#cancel-password').addEventListener('click',closePassword);sendPasswordCode.addEventListener('click',()=>{passwordCodeSent=true;let seconds=60;sendPasswordCode.disabled=true;sendPasswordCode.textContent=`${seconds}s 后重发`;passwordError.textContent='验证码已发送至绑定手机号';passwordError.style.color='var(--color-success)';passwordCodeTimer=setInterval(()=>{seconds--;sendPasswordCode.textContent=seconds?`${seconds}s 后重发`:'发送验证码';if(!seconds){clearInterval(passwordCodeTimer);passwordCodeTimer=null;sendPasswordCode.disabled=false}},1000)});document.querySelector('#save-password').addEventListener('click',()=>{const password=document.querySelector('#new-password').value,confirmation=document.querySelector('#confirm-password').value,code=passwordCode.value.trim();passwordError.style.color='var(--color-danger)';if(!password||!confirmation){passwordError.textContent='请完整输入两次新密码';return}if(password!==confirmation){passwordError.textContent='两次输入的新密码不一致';document.querySelector('#confirm-password').focus();return}if(!passwordCodeSent){passwordError.textContent='请先发送手机验证码';return}if(code!=='123456'){passwordError.textContent='手机验证码不正确，请重新输入';passwordCode.focus();return}closePassword()});passwordMask.addEventListener('click',event=>{if(event.target===passwordMask)closePassword()});
document.querySelector('#annotate-current').addEventListener('click',()=>{const frame=frames[current.frame],url=new URL(frame.getAttribute('src'),document.baseURI).href;window.open(url,'_blank','noopener')});
const sidebarToggle=document.querySelector('#sidebar-toggle');const compactLayout=window.matchMedia('(max-width:767px)');
function syncSidebarToggle(){const expanded=compactLayout.matches?app.classList.contains('sidebar-expanded'):!app.classList.contains('sidebar-collapsed');sidebarToggle.setAttribute('aria-expanded',String(expanded));sidebarToggle.setAttribute('aria-label',expanded?'收起菜单':'展开菜单');sidebarToggle.title=expanded?'收起菜单':'展开菜单'}
sidebarToggle.addEventListener('click',()=>{app.classList.toggle(compactLayout.matches?'sidebar-expanded':'sidebar-collapsed');hideCollapsedMenu();syncSidebarToggle()});
compactLayout.addEventListener('change',()=>{app.classList.remove('sidebar-expanded','sidebar-collapsed');syncSidebarToggle()});
syncSidebarToggle();
activateFeature('home');
</script>
</body>
</html>
